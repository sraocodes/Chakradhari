<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chakradhari Computational Technologies. Coming soon." />
  <meta name="theme-color" content="#080B11" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
  <title>Chakradhari Computational Technologies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/gif" href="assets/images/logo.gif">

  <style>
    :root {
      --bg: #080B11;
      --text: #EAF0FA;
      --text-soft: #9DAAC2;
      --text-faint: #5E6B84;
      --blue: #2E9BFF;
      --leaf: #57E0A6;
      --line: rgba(255,255,255,0.09);
      --glow: rgba(46,155,255,0.16);
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark light;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F7F6F2;
        --text: #12161F;
        --text-soft: #4B5568;
        --text-faint: #7C879C;
        --blue: #0A6ED1;
        --leaf: #1D8F63;
        --line: rgba(10,14,20,0.12);
        --glow: rgba(10,110,209,0.10);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(60rem 40rem at 50% 35%, var(--glow), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3rem, 10vh, 6rem) 1rem 3rem;
    }
    .inner {
      width: 100%;
      max-width: 40rem;
      text-align: center;
    }

    .logo {
      display: block;
      width: clamp(88px, 18vw, 120px);
      height: auto;
      margin: 0 auto 1.75rem;
    }
    .company {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 1.25rem 0 0;
    }
    h1 em {
      font-style: italic;
      color: var(--blue);
    }
    .lead {
      font-size: clamp(1.05rem, 2.4vw, 1.2rem);
      color: var(--text);
      max-width: 34rem;
      margin: 0 auto;
    }
    .body {
      color: var(--text-soft);
      max-width: 34rem;
      margin: 1rem auto 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.5rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--text-soft);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--leaf);
      box-shadow: 0 0 0 0 var(--leaf);
      animation: pulse 2.4s var(--ease) infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--leaf) 55%, transparent); }
      70%  { box-shadow: 0 0 0 9px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.9s var(--ease) forwards;
    }
    .reveal:nth-child(2) { animation-delay: 0.08s; }
    .reveal:nth-child(3) { animation-delay: 0.16s; }
    .reveal:nth-child(4) { animation-delay: 0.24s; }
    .reveal:nth-child(5) { animation-delay: 0.32s; }
    .reveal:nth-child(6) { animation-delay: 0.40s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    footer {
      padding: 1.5rem 1rem 2rem;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.8;
      color: var(--text-faint);
    }
    footer .name { letter-spacing: 0.06em; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; animation: none; }
      .dot { animation: none; }
    }
  </style>
</head>
<body>

  <main>
    <div class="inner">
      <img class="logo reveal" src="assets/images/logo.gif" alt="Chakradhari logo" width="120" height="120" decoding="async" />
      <p class="company reveal">Chakradhari Computational Technologies</p>
      <h1 class="reveal">Science, <em>engineered</em> into tools.</h1>
      <p class="status reveal"><span class="dot" aria-hidden="true"></span>Coming soon</p>
    </div>
  </main>

  <footer>
    CIN: U72100KA2025PTC209662 &nbsp;·&nbsp; Om Chambers, 648/A, 4th Floor, 1st Stage, Indiranagar, Bengaluru 560038, India<br>
    © Chakradhari Computational Technologies Pvt. Ltd.
  </footer>

</body>
</html>
